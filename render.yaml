services:
  # ── Backend (Docker) ─────────────────────────────────────────────────────────
  - type: web
    name: student-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: "8080"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "db_student"
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require

  # ── Frontend (Static) ────────────────────────────────────────────────────────
  - type: web
    name: student-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://student-backend.onrender.com
